services:
  db:
    image: mariadb:11.4
    environment:
      MARIADB_ROOT_PASSWORD: rootpw
      MARIADB_DATABASE: wp
      MARIADB_USER: wp
      MARIADB_PASSWORD: wppw
  wp:
    image: wordpress:php8.4-apache
    depends_on: [db]
    ports: ["127.0.0.1:8780:80"]
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_USER: wp
      WORDPRESS_DB_PASSWORD: wppw
      WORDPRESS_DB_NAME: wp
    volumes: ["wpdata:/var/www/html"]
  cli:
    image: wordpress:cli-php8.4
    depends_on: [wp]
    user: "33:33"
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_USER: wp
      WORDPRESS_DB_PASSWORD: wppw
      WORDPRESS_DB_NAME: wp
      HOME: /tmp
    volumes: ["wpdata:/var/www/html"]
    entrypoint: ["sleep", "infinity"]
volumes:
  wpdata:
