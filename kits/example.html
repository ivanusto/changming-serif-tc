<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>昌明體 ChangMing Serif TC 範例</title>
<link rel="preload" href="changming/fonts/{{PRELOAD_L0}}" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="changming/fonts/{{PRELOAD_H0}}" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="changming/changming.css">
<link rel="stylesheet" href="changming/changming-tail.css" media="print" onload="this.media='all'">
<style>
  body { font-family: "ChangMing Serif TC", Georgia, serif; max-width: 42rem; margin: 3rem auto; padding: 0 1.25rem; line-height: 1.8; color: #1d1d1f; }
  h1 { font-size: 2.2rem; line-height: 1.3; font-weight: 700; margin-bottom: .5rem; }
  h2 { font-size: 1.4rem; font-weight: 700; margin-top: 2rem; }
  .meta { color: #6e6e73; font-size: .95rem; }
  .big { font-size: 5rem; line-height: 1.2; letter-spacing: .05em; }
</style>
</head>
<body>
  <h1>昌明體：給繁體中文網站的人文明體</h1>
  <p class="meta">ChangMing Serif TC {{VERSION}}，400 與 700 兩個字重</p>

  <h2>段落範例</h2>
  <p>昌明體以思源明體為骨架，收斂了三角襯線、圓潤了筆畫轉折，並降低橫豎粗細的對比，讓長篇文字讀起來更平穩。<strong>粗體使用 700 字重</strong>，英文 English text 與數字 0123456789 也保持一致的風格。</p>
  <p>罕用字也能正常顯示：鑽齌遳蹤錸匉峁隳褰。</p>

  <h2>大字</h2>
  <p class="big">永東國酬愛鬱靈鷹袋</p>
</body>
</html>
